name: FormatRust

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all

      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "style: format files with rustfmt"
